<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No está esta página · {{ site.Title }}</title>
  <meta name="robots" content="noindex">
  {{ $css := resources.Get "css/main.css" | minify | fingerprint "sha256" }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}" crossorigin="anonymous">
  <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
</head>
<body>
  <div class="banda" aria-hidden="true"></div>
  <main id="contenido">
    <p class="kicker">404</p>
    <h1>Esta página no está.</h1>
    <p class="lede">El enlace se rompió o el texto todavía no existe.</p>
    <p><a class="button" href="{{ site.Home.RelPermalink }}">Volver al inicio</a></p>
  </main>
</body>
</html>
