# Hasta que sean Libres
# baseURL se reemplaza al publicar: la acción de GitHub Pages
# pasa --baseURL con la URL real (usuario.github.io o usuario.github.io/repo/).
# Este valor solo importa si compilas en local fuera de `hugo server`.
baseURL = "https://github.io"
locale = "es"
defaultContentLanguage = "es"
title = "Hasta que sean Libres"
timeZone = "America/New_York"
enableRobotsTXT = true
enableGitInfo = true
buildDrafts = false
buildFuture = false

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
      hardWraps = true
    [markup.goldmark.parser]
      autoHeadingID = true

[params]
  author = "Betty Guerra Perdomo"
  description = "Cuaderno por los presos políticos de Cuba. Voces, reflexiones y poemas. Hasta que sean libres."
  # Usuario de Buttondown, solo el nombre, sin URL.
  # Ejemplo: buttondown = "hastaquesanlibres"
  # Vacío = el formulario no se publica.
  buttondown = "buttondown.com/bettyfreecuban"
  # Déjalo vacío ("") para ocultar el enlace.
  x = "https://x.com/BettyFreeCuban"

[[menus.main]]
  name = "Inicio"
  pageRef = "/"
  weight = 1

[[menus.main]]
  name = "Voces"
  pageRef = "/voces"
  weight = 2

[[menus.main]]
  name = "Reflexiones"
  pageRef = "/reflexiones"
  weight = 3

[[menus.main]]
  name = "Poemas"
  pageRef = "/poemas"
  weight = 4

[[menus.main]]
  name = "Acerca"
  pageRef = "/acerca"
  weight = 5
